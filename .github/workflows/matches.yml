name: Matches

on:
  push:
    branches: [ feature/nnue-search ]
  workflow_dispatch: {}

jobs:
  run-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build unzip curl cutechess-cli || true

      - name: Build
        run: |
          mkdir -p build
          cmake -S . -B build
          cmake --build build --config Release

      - name: Download opponent engines
        run: scripts/download_engines.sh || true

      - name: Run matches (small smoke)
        env:
          GAMES: 8
          TC: "5+0"
        run: |
          chmod +x scripts/run_matches.sh
          ./scripts/run_matches.sh

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: match-logs
          path: logs/**
